  :root{
    --bg:#14161f; --panel:#1e2130; --panel2:#272b3d; --line:#3a3f57;
    --ink:#f2efe6; --dim:#9aa0b8;
    --ok:#4ade80; --bad:#f87171; --gold:#fbbf24; --ink-orange:#fb923c;
    --tap:56px;
    /* тетрадь: бумага, линейка, поля, синяя ручка */
    --paper:#fdfcf6; --rule:#bcd3f0; --margin:#f4a4a4; --pen:#1e3a8a; --pen-dim:#5b6b99;
    --q:#ea580c;   /* буква под вопросом — оранжевая, как опасное место в §11 ТЗ */
    --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
    --print:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  /* переключатель «печатный»: тот же текст без рукописного шрифта */
  body.print{--hand:var(--print)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:10px 12px 28px;overscroll-behavior:none}
  .wrap{max-width:520px;margin:0 auto}

  /* ---- шапка: звёзды и здоровье Кляксы ---- */
  .hud{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .stars{font-weight:800;font-size:19px;color:var(--gold);white-space:nowrap}
  .hp{flex:1;height:14px;background:var(--panel2);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
  .hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a78bfa,#7c3aed);transition:width .45s}
  .round{font-size:13px;color:var(--dim);white-space:nowrap}

  /* ---- Клякса ---- */
  .setline{display:flex;align-items:center;gap:7px;margin:-4px 0 12px;
    font-size:13px;color:var(--dim)}
  .setline::before{content:"📄";font-size:13px}
  .setline b{color:var(--ink);font-weight:700}

  .kl{display:flex;gap:8px;align-items:center;margin-bottom:14px}
  .kl svg{flex:none;width:88px;height:88px;overflow:visible}
  /* пузырь — кнопка: нажала, и Клякса повторяет реплику вслух */
  .bubble{background:var(--panel);border:2px solid var(--line);border-radius:14px;
    padding:10px 13px;font:inherit;font-size:15px;color:var(--ink);text-align:left;
    min-height:56px;display:flex;align-items:center;flex:1;cursor:pointer;position:relative}
  .bubble::after{content:"🔊";font-size:13px;opacity:.55;margin-left:8px;flex:none}
  .bubble b{color:var(--ink-orange)}

  /* мимика: показываем набор бровей и рта под текущее настроение */
  #kl .m{display:none}
  #kl[data-mood="smug"]  .m-smug,
  #kl[data-mood="happy"] .m-happy,
  #kl[data-mood="sad"]   .m-sad{display:inline}
  /* лёгкое покачивание и редкое моргание; без вспышек и мигания цвета (§11) */
  .kl-bob{animation:bob 3.2s ease-in-out infinite;transform-origin:60px 100px}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .kl-eyes{animation:blink 5s infinite;transform-origin:60px 59px}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  #kl.hit .kl-bob{animation:squish .45s ease-out}
  @keyframes squish{0%{transform:scale(1,1)}35%{transform:scale(1.12,.86)}70%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}
  @media (prefers-reduced-motion:reduce){ .kl-bob,.kl-eyes,#kl.hit .kl-bob{animation:none} }

  .voice-toggle{flex:none;min-width:44px;height:36px;border-radius:10px;background:var(--panel2);
    border:2px solid var(--line);color:var(--ink);font-size:17px;cursor:pointer;padding:0 6px}

  #lessonPanel{background:var(--panel);border:2px solid var(--line);border-radius:14px;
    padding:12px;margin-bottom:14px}
  #lessonPanel textarea,#lessonPanel input{width:100%;background:var(--panel2);color:var(--ink);
    border:2px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
  #lessonPanel textarea{font:13px/1.4 ui-monospace,Consolas,monospace}
  #lessonPanel input{font:inherit;font-size:16px;min-height:48px}
  #lessonPanel .ok{color:var(--ok)} #lessonPanel .err{color:var(--bad)}
  /* выбор набора: урок, все слова или только трудные */
  #modes{display:flex;flex-wrap:wrap;gap:6px}
  .mode{background:var(--panel2);border:2px solid var(--line);border-radius:10px;color:var(--ink);
    font:inherit;font-size:14px;padding:9px 11px;min-height:44px;cursor:pointer}
  .mode b{color:var(--dim);font-weight:700;margin-left:4px}
  .mode.on{border-color:var(--ink-orange);background:#2a2117}
  .mode.on b{color:var(--ink-orange)}
  /* список слов в базе */
  #words{max-height:260px;overflow:auto;margin-top:8px}
  .wrow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
  .wrow.dim{opacity:.45}
  .wrow .wt{flex:1;font-size:15px}
  .wrow .ws{font-size:13px;color:var(--dim);white-space:nowrap}
  .wb{background:none;border:0;color:var(--ink);font-size:16px;cursor:pointer;
    min-width:36px;min-height:36px;padding:0}

  h1{font-size:21px;margin:0 0 6px}
  .task{font-size:15px;color:var(--dim);margin:0 0 14px}

  /* ---- карточки слов ---- */
  .cards{display:grid;gap:9px}
  /* карточка слова = полоска тетрадного листа: поля под эмодзи, дальше линейка */
  .card{display:flex;align-items:center;gap:14px;min-height:64px;
    background:var(--paper) linear-gradient(to right,transparent 50px,var(--margin) 50px,var(--margin) 52px,transparent 52px);
    border:2px solid #d9d4c2;border-radius:12px;
    padding:6px 12px 6px 10px;cursor:pointer;transition:.15s;width:100%;text-align:left;
    font:inherit;color:var(--pen)}
  .card:active{transform:scale(.985)}
  .card .em{font-size:26px;flex:none;width:32px;text-align:center}
  .card .tx{font-family:var(--hand);font-size:36px;font-weight:600;line-height:48px;flex:1;
    letter-spacing:.02em;
    background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,var(--rule) 44px,var(--rule) 46px,transparent 46px,transparent 48px)}
  body.print .card .tx{font-size:27px;font-weight:800;letter-spacing:.05em}
  .card .spk{background:#efeadb;border-color:#d9d4c2}
  .card.cleared{opacity:.38;border-style:dashed;pointer-events:none}
  .card.wrong{border-color:var(--bad);animation:shake .4s}
  .card.right{border-color:var(--ok);background-color:#e6f6ea}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* подсветка подозрительной буквы после разоблачения */
  .lit{color:#dc2626;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:3px}
  .fixed{color:#16a34a}
  /* буква, о которой говорит правило: {е} в тексте → оранжевая и жирная */
  .q{color:var(--q);font-weight:800;font-size:1.18em}

  /* ---- кнопки ---- */
  .btn{display:block;width:100%;min-height:var(--tap);margin-top:9px;
    background:var(--panel);border:2px solid var(--line);border-radius:14px;
    color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;cursor:pointer;text-align:left}
  .btn:active{transform:scale(.985)}
  .btn.big{background:var(--ink-orange);border-color:var(--ink-orange);color:#14161f;
    font-weight:800;font-size:18px;text-align:center}
  .btn.ghost{background:transparent;color:var(--dim);font-size:14px;min-height:48px;text-align:center}
  .btn.wrong{border-color:var(--bad)}
  .btn.right{border-color:var(--ok);background:#14301f}

  /* ---- выбор буквы ---- */
  .letters{display:flex;gap:10px;justify-content:center;margin-top:6px}
  .letter{width:80px;height:80px;font-family:var(--hand);font-size:48px;font-weight:700;line-height:1;
    background:var(--paper);border:2px solid #d9d4c2;border-radius:16px;color:var(--pen);cursor:pointer}
  body.print .letter{font-size:36px}
  .letter:active{transform:scale(.95)}
  .letter.wrong{border-color:var(--bad);animation:shake .4s}
  .letter.right{border-color:var(--ok);background:#e6f6ea}

  .word-fix{font-family:var(--hand);font-size:56px;font-weight:700;letter-spacing:.03em;text-align:center;
    color:var(--pen);margin:14px 0;padding:4px 10px 4px 34px;line-height:72px;border-radius:12px;
    background:
      linear-gradient(to right,transparent 22px,var(--margin) 22px,var(--margin) 24px,transparent 24px),
      repeating-linear-gradient(to bottom,transparent 0,transparent 66px,var(--rule) 66px,var(--rule) 68px,transparent 68px,transparent 72px),
      var(--paper)}
  body.print .word-fix{font-size:42px;font-weight:800}

  .spk{display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:44px;border-radius:12px;background:var(--panel2);
    border:2px solid var(--line);flex:none;cursor:pointer;font-size:19px}
  .btn.proof{display:flex;align-items:center;gap:11px}
  /* улика — тоже запись в тетради */
  .btn.proof{background:var(--paper);border-color:#d9d4c2;color:var(--pen)}
  .btn.proof .spk{background:#efeadb;border-color:#d9d4c2}
  .btn.proof .ptx{flex:1;display:flex;flex-direction:column;gap:2px}
  .btn.proof .pt{font-family:var(--hand);font-size:25px;font-weight:600;line-height:32px;
    background:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,var(--rule) 30px,var(--rule) 31px,transparent 31px,transparent 32px)}
  .btn.proof .pex{font-family:var(--hand);font-size:21px;line-height:28px;color:var(--pen-dim)}
  body.print .btn.proof .pt{font-size:17px;line-height:26px;background:none}
  body.print .btn.proof .pex{font-size:14px;line-height:20px}
  .btn.proof.right{background:#e6f6ea}
  .btn.cleared{opacity:.38;pointer-events:none}

  .font-toggle{flex:none;min-width:48px;height:36px;border-radius:10px;background:var(--panel2);
    border:2px solid var(--line);color:var(--ink);font:600 14px var(--print);cursor:pointer;padding:0 8px}
  .card.suspect{cursor:default;margin-bottom:12px;border-color:var(--bad)}
  .card.suspect:active{transform:none}

  .gain{text-align:center;font-size:30px;font-weight:800;color:var(--gold);margin:14px 0}
  .gain.big{font-size:56px;margin:10px 0 4px}

  /* правило, применённое к этому слову */
  .rule-line{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--pen);
    border:2px solid #d9d4c2;border-radius:12px;padding:10px 12px;margin:0 0 14px;
    font-family:var(--hand);font-size:23px;line-height:30px}
  body.print .rule-line{font-size:16px;line-height:22px}
  .rule-line .spk{background:#efeadb;border-color:#d9d4c2}
  .rule-line.center-line{justify-content:center;text-align:center}
  .rule-txt{display:flex;flex-direction:column;gap:2px}
  .rule-txt .gen{font-size:.86em;color:var(--pen-dim)}

  /* праздник в конце: салют на холсте + взлетающие шарики */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:4}
  .balloon{position:fixed;left:50%;bottom:-160px;width:64px;pointer-events:none;z-index:3;
    animation:rise 5s ease-in forwards}
  @keyframes rise{
    0%{transform:translate(-50%,0) rotate(-4deg);opacity:0}
    12%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx,0px)),-115vh) rotate(6deg);opacity:1}}
  @media (prefers-reduced-motion:reduce){ .balloon{display:none} }

  /* грамота: свиток разворачивается сверху вниз */
  .scroll{margin:6px 0 14px;position:relative;z-index:5}
  .scroll .rod{height:16px;border-radius:9px;background:linear-gradient(#b45309,#7c2d12 60%,#451a03);
    box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .parch{overflow:hidden;height:0;animation:unroll .85s cubic-bezier(.2,.8,.25,1) .15s forwards;
    background:
      linear-gradient(to right,transparent 26px,var(--margin) 26px,var(--margin) 28px,transparent 28px),
      radial-gradient(120% 90% at 50% 0,#fffdf3,#f4e8c8);
    border-left:2px solid #e2d3a8;border-right:2px solid #e2d3a8}
  @keyframes unroll{to{height:190px}}
  .parch .in{display:flex;flex-direction:column;align-items:center;justify-content:center;height:190px;
    opacity:0;animation:fadeIn .5s ease .7s forwards;color:#7c2d12;padding:0 14px}
  @keyframes fadeIn{to{opacity:1}}
  .parch .hooray{font-family:var(--hand);font-size:54px;font-weight:700;line-height:1.05;color:#b45309}
  body.print .parch .hooray{font-size:38px;font-weight:800}
  .parch .who{font-family:var(--hand);font-size:24px;color:#8a6a3a;margin-top:2px}
  body.print .parch .who{font-size:16px}
  .parch .seal{margin-top:8px;width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fb7185,#be123c);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 3px 8px rgba(0,0,0,.3)}
  @media (prefers-reduced-motion:reduce){
    .parch{animation:none;height:190px} .parch .in{animation:none;opacity:1} }
  .hide{display:none!important}
  .center{text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="hud">
    <div class="stars" id="stars">⭐ 0</div>
    <div class="hp"><i id="hp"></i></div>
    <div class="round" id="round"></div>
    <button class="voice-toggle" id="lessonBtn" title="Загрузить новый урок">📄</button>
    <button class="voice-toggle" id="voiceToggle" title="Клякса говорит вслух или молчит">🗣️</button>
    <button class="font-toggle" id="fontToggle" title="Шрифт: тетрадь или печатный">Аа</button>
  </div>

  <div class="kl">
    <!-- Клякса: собственный персонаж проекта. Чернильная капля-хулиганка
         в маске-домино. Стилистика «яркий глянцевый мультик», но без элементов
         чужих франшиз (§3.1 ТЗ). Выражение задаётся атрибутом data-mood. -->
    <svg viewBox="0 0 120 120" id="kl" data-mood="smug" aria-hidden="true">
      <defs>
        <radialGradient id="klBody" cx="36%" cy="28%" r="78%">
          <stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#6d28d9"/><stop offset="1" stop-color="#2e1065"/>
        </radialGradient>
        <linearGradient id="klMask" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f9a8d4"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/>
        </linearGradient>
        <radialGradient id="klIris" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#a5f3fc"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/>
        </radialGradient>
      </defs>

      <g class="kl-bob">
        <!-- брызги -->
        <circle cx="106" cy="96" r="4.5" fill="#4c1d95"/><circle cx="14" cy="98" r="3.5" fill="#4c1d95"/>
        <circle cx="104" cy="22" r="3" fill="#6d28d9"/>
        <!-- искорки -->
        <path d="M14 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fde68a"/>
        <path d="M108 58l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fde68a"/>

        <!-- чернильный хохолок на макушке -->
        <path fill="#7c3aed" d="M50 18c-2-9 5-16 14-16-5 3-7 8-4 12 3-6 10-8 16-5-6 1-10 5-10 10z"/>
        <!-- тело-капля с потёками -->
        <path fill="url(#klBody)" d="M60 13c18 0 29 10 35 22 10 4 15 16 11 27 6 12-2 26-14 30-2 8-6 15-12 13-4-2-2-8-6-9-6 7-16 9-24 5-4 6-12 8-14 2-2-5 4-8 0-12-14-2-24-14-20-28-8-10-4-26 10-32 6-12 18-18 34-18z"/>
        <!-- глянцевый блик -->
        <ellipse cx="40" cy="30" rx="15" ry="8" fill="#fff" opacity=".32" transform="rotate(-24 40 30)"/>
        <ellipse cx="30" cy="42" rx="3.5" ry="2.5" fill="#fff" opacity=".35"/>

        <!-- румянец -->
        <ellipse cx="29" cy="78" rx="8" ry="5" fill="#f472b6" opacity=".55"/>
        <ellipse cx="91" cy="78" rx="8" ry="5" fill="#f472b6" opacity=".55"/>

        <!-- маска-домино -->
        <path fill="url(#klMask)" stroke="#9d174d" stroke-width="1.5"
          d="M19 56c5-14 29-14 41-4 12-10 36-10 41 4 3 10-6 18-17 17-9-1-17-6-24-9-7 3-15 8-24 9-11 1-20-7-17-17z"/>
        <path d="M27 50c6-5 16-5 23-1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/>

        <!-- глаза -->
        <g class="kl-eyes">
          <ellipse cx="41" cy="59" rx="11" ry="12" fill="#fff"/>
          <ellipse cx="79" cy="59" rx="11" ry="12" fill="#fff"/>
          <circle class="kl-iris" cx="42" cy="60" r="7.5" fill="url(#klIris)"/>
          <circle class="kl-iris" cx="80" cy="60" r="7.5" fill="url(#klIris)"/>
          <circle cx="42" cy="60" r="3.8" fill="#0f172a"/><circle cx="80" cy="60" r="3.8" fill="#0f172a"/>
          <circle cx="45" cy="56.5" r="2.6" fill="#fff"/><circle cx="83" cy="56.5" r="2.6" fill="#fff"/>
          <circle cx="39.5" cy="63" r="1.3" fill="#fff"/><circle cx="77.5" cy="63" r="1.3" fill="#fff"/>
        </g>

        <!-- брови и рот: по одному набору на настроение -->
        <g class="m m-smug">
          <path d="M28 40c6-6 14-7 20-3" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M72 42c6-1 13 0 20 3" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M45 85c9 8 22 7 31-4" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M69 86l3 6 3-7z" fill="#fff"/>
        </g>
        <g class="m m-happy">
          <path d="M29 41c6-5 13-5 19-2" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M72 39c6-3 13-3 19 2" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M45 82c8 13 22 13 30 0z" fill="#1e0a3c"/>
          <ellipse cx="60" cy="89" rx="7" ry="3.5" fill="#f472b6"/>
        </g>
        <g class="m m-sad">
          <!-- внутренние концы бровей подняты: грусть, а не злость -->
          <path d="M29 45c7-1 14-4 19-9" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M91 45c-7-1-14-4-19-9" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M47 92c7-8 19-8 26 0" fill="none" stroke="#1e0a3c" stroke-width="4" stroke-linecap="round"/>
          <path d="M92 66c2 5 2 8 0 10-2-2-2-5 0-10z" fill="#7dd3fc"/>
        </g>
      </g>
    </svg>
    <button class="bubble" id="say" title="Послушать Кляксу ещё раз">…</button>
  </div>

  <!-- какой набор сейчас тренируем: видно на всех экранах игры -->
  <div id="setline" class="setline"></div>

  <!-- В игре остаётся только выбор набора. Уроки и слова — в кабинете:
       ребёнку они не нужны и только мешают. -->
  <div id="lessonPanel" class="card-dark" hidden>
    <p class="task" style="margin:0 0 6px">Что тренируем</p>
    <div id="modes"></div>
    <div id="lessonMsg" class="task" style="margin:10px 0 0"></div>
    <div class="task" style="margin:10px 0 0;font-size:12px;opacity:.6">
      Версия игры: <span id="ver"></span> ·
      <a href="../parent/" style="color:var(--dim)">кабинет</a>
    </div>
  </div>

  <div id="screen"></div>
</div>

<script>
/* ============================================================
   «Кто самозванец?» — прототип для задачи 0.4.
   Один файл, урок внутри, никаких запросов наружу.
   Движка, базы и сборки сессии здесь намеренно нет: цель —
   выяснить, интересно ли ребёнку, а не построить приложение.
   ============================================================ */

// --- урок: lessons/2026-09-22-upr111.json, сокращённо -------------
const LESSON = {
  title: "Упр. 111: правописание суффиксов",
  words: [

    {t:"овражек",    em:"🏞️", i:5, ok:"е", bad:"и", type:"SUFFIX_IK_EK",
     ctx:"За домом был небольшой овражек."},
    {t:"ежонок",     em:"🦔", i:2, ok:"о", bad:"ё", type:"SUFFIX_CUB",
     ctx:"Ежонок нашёл в траве яблоко."},
    {t:"оленёнок",   em:"🦌", i:4, ok:"ё", bad:"о", type:"SUFFIX_CUB",
     ctx:"Оленёнок бежит за мамой."},
    {t:"утята",      em:"🦆", i:2, ok:"я", bad:"а", type:"SUFFIX_CUB",
     ctx:"Утята плывут за уткой."},
    {t:"берёзонька", em:"🌳", i:5, ok:"о", bad:"е", type:"SUFFIX_DIM",
     ctx:"Во дворе растёт берёзонька."},
    {t:"сказочка",   em:"📖", i:4, ok:"о", bad:"е", type:"SUFFIX_DIM",
     ctx:"Какая добрая сказочка!"},

// Улика = формулировка правила. Ребёнок должен не просто ткнуть в слово,

// Формулировки — после первой игры: коротко, обычными словами, с примером.
// Примеры намеренно НЕ из урока, иначе пример подсказал бы ответ.
// {е} — буква, о которой говорит правило: на экране оранжевая и жирная,
// в озвучке скобки выбрасываются (второе замечание после игры).

// {буква} → подсветка на экране; для озвучки — без скобок.
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function mark(s){ return esc(s).replace(/\{([^{}]+)\}/g, '<b class="q">$1</b>'); }
function plain(s){ return s.replace(/[{}]/g, ""); }

// Подсказка к конкретному слову — вторая ступень лесенки подсказок.
const HINT = {
  SUFFIX_IK_EK: w => "Скажи: «нет " + genitive(w) + "»… слышишь, что случилось с гласной?",
  SUFFIX_CUB  : w => "Посмотри на букву перед суффиксом. Это ж, ч, ш или щ?",
  SUFFIX_DIM  : w => "Согласная перед суффиксом — твёрдая или мягкая?",
  SUFFIX_CONST: w => "Этот суффикс всегда один и тот же. Вспомни, как он выглядит."
};

// Форму «нет кого?» строим из известного ответа, а не подгонкой окончаний:
// в суффиксе -ек гласная выпадает (овражек — овражка), в -ик остаётся
// (мячик — мячика). Именно это выпадение и есть проверка, поэтому
// ошибиться здесь нельзя — подсказка показала бы обратное правилу.
// Правило, применённое к этому слову. Берём способ проверки из урока,
// а если его нет (урок по умолчанию) — собираем из типа орфограммы.
// full=false — только способ проверки, до выбора буквы. Последние шаги
// алгоритма в уроке обычно называют ответ («значит, пиши и»), и показывать
// их раньше времени нельзя: выбирать станет нечего.
// Возвращает две части: наблюдение по этому слову и само правило.
// Одного наблюдения мало — «перед суффиксом буква н» не говорит, что
// выбрать. Одного правила тоже мало — его надо приложить к слову.
// Поэтому показываем обе строки, а вывод ребёнок делает сам.
function ruleFor(w, full){
  const m = w.m;
  const ok = w.ok;
  // шаг, который называет ответ, до выбора буквы не показываем
  // Выбрасываем только прямое называние ответа. Само слово в шаге —
  // не утечка: «нет мячика» и есть проверка, ради неё всё и делается.
  const reveals = s => /^\s*значит/i.test(s)
        || new RegExp("пиши\\s+-?" + ok, "i").test(s);

  let own = "";
  if(m){
    if(m.kind === "check_word") own = "Проверочное слово: " + m.checkWord;
    else if(m.kind === "mnemonic") own = m.mnemonic;
    else if(m.kind === "algorithm" && m.steps && m.steps.length){
      const steps = full ? m.steps : m.steps.filter(s => !reveals(s));
      own = steps.join(". ");
    }
  }
  if(!own){
    const before = Array.from(w.t)[w.i - 1] || "";
    if(w.type === "SUFFIX_IK_EK") own = "Скажи: нет " + genitive(w);
    else if(w.type === "SUFFIX_CUB" || w.type === "SUFFIX_DIM")
      own = "Перед суффиксом буква «" + before + "»";
    // границу суффикса по одной букве не угадываем: «учитель» → «-ель»
    // вместо «-тель» было бы неверным разбором
  }
  return {own, rule: PROOF[w.type] ? PROOF[w.type].text : ""};
}

// одна строка для озвучки
function ruleText(w, full){
  const r = ruleFor(w, full);
  return [r.own, r.rule].filter(Boolean).join(". ");
}

// разметка блока с правилом
function ruleBlock(w, full, id, center){
  const r = ruleFor(w, full);
  if(!r.own && !r.rule) return "";
  return '<div class="rule-line' + (center ? " center-line" : "") + '">' +
    '<span class="spk" id="' + id + '">🔊</span>' +
    '<span class="rule-txt">' +
      (r.own  ? '<span class="own">'  + mark(r.own)  + '</span>' : "") +
      (r.rule ? '<span class="gen">'  + mark(r.rule) + '</span>' : "") +
    '</span></div>';
}

function genitive(w){
  const ch = Array.from(w.t);
  if (w.ok === "е") ch.splice(w.i, 1);
  return ch.join("") + "а";
}

// --- озвучка -------------------------------------------------------
// Синтез годится для инструкций и обычного произношения слова.
// Режим «как пишется» здесь НЕ используется: движок читает безударную
// «о» как «а» (проверено в задаче 0.1), и проговаривать так эталон
// написания нельзя — это закрепит ровно ту ошибку, которую мы лечим.
let voice = null;
function pickVoice(){
  const v = speechSynthesis.getVoices().filter(x => (x.lang||"").toLowerCase().startsWith("ru"));
  voice = v.find(x => x.localService) || v[0] || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU"; u.rate = .92;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){/* молча: без голоса игра всё равно играется */}
}

// --- Клякса молчит / говорит ---------------------------------------
// Выключается только то, что Клякса произносит САМА. Всё остальное
// остаётся на слух по кнопке: нажать на пузырь — она повторит реплику,
// 🔊 у слова и у правила работают всегда. Так §11 ТЗ («всё доступно
// на слух») не нарушается, просто по запросу, а не навязчиво.
let quiet = false;
try{ quiet = localStorage.getItem("slovograd.quiet") === "1"; }catch(e){}

}
// то, что звучит само по себе, без нажатия ребёнка
function autoSpeak(text){ if(!quiet) speak(text); }

// --- мимика Кляксы -------------------------------------------------
// smug — дразнится, happy — радуется своей пакости, sad — разоблачена
function face(mood){

  if(mood === "sad"){ kl.classList.remove("hit"); void kl.getBoundingClientRect(); kl.classList.add("hit"); }

let lastLine = "";
function talk(html, voiceText, mood){

// --- сборка раунда -------------------------------------------------
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function corrupt(w){
  const ch = Array.from(w.t); ch[w.i] = w.bad; return ch.join("");
}

// --- загрузка урока из lesson.json ---------------------------------
// Слова кончаются быстро, и играть становится не во что. Поэтому урок
// не зашит в игру: можно вставить любой lesson.json от генератора.
let used = new Set();            // кого уже ловили в этом заходе

function convertLesson(data){
  if(!data || data.schemaVersion !== 1 || !Array.isArray(data.words))
    throw new Error("Это не похоже на lesson.json: нет schemaVersion или words.");
  const words = [], skipped = [];
  for(const w of data.words){
    const o = (w.orthograms || []).find(x => x.length === 1 && PROOF[x.type]);
    if(!o){ skipped.push(w.text); continue; }
    const bad = (o.distractors || []).find(d => d.length === 1 && d !== o.correct);
    if(!bad){ skipped.push(w.text); continue; }
    // способ проверки из урока сохраняем: правило нужно показать
    // применённым к этому самому слову, а не только в общем виде
    words.push({t:w.text, em:w.emoji || "📘", i:o.index, ok:o.correct,
                bad, type:o.type, ctx:w.context || w.text, m:o.method || null});
  }
  // трёх слов хватает: соседние карточки доберём из общей базы
  if(words.length < 3)
    throw new Error("Годных слов " + words.length + ", а нужно хотя бы 3.");
  return {title:data.title || "Урок", words, skipped};
}

// --- база слов ------------------------------------------------------
// Слова лежат в общем пуле, а урок — это метка на слове. Тогда можно
// и отработать ровно упражнение 110, и гонять трудные слова из всех
// уроков разом. Слово из двух уроков — одно, но помнит оба источника,
// и ошибки у него считаются общие.
let POOL = [], LESSONS = [], MODE = {kind:"all"};

const keyOf = w => w.t + "|" + w.i + "|" + w.type;

function savePool(){
  try{
    localStorage.setItem("slovograd.pool", JSON.stringify(POOL));
    localStorage.setItem("slovograd.lessons", JSON.stringify(LESSONS));
    localStorage.setItem("slovograd.mode", JSON.stringify(MODE));
  }catch(e){}
}

function loadPool(){
  try{
    POOL = JSON.parse(localStorage.getItem("slovograd.pool") || "[]");
    LESSONS = JSON.parse(localStorage.getItem("slovograd.lessons") || "[]");
    MODE = JSON.parse(localStorage.getItem("slovograd.mode") || '{"kind":"all"}');
  }catch(e){ POOL = []; LESSONS = []; MODE = {kind:"all"}; }
}

// слово трудное: либо помечено руками, либо ошибок не меньше, чем верных
function isHard(w){
  if(w.hard === true) return true;
  if(w.hard === false) return false;
  const s = w.st || {ok:0, err:0};
  return s.err > 0 && s.err >= s.ok;
}

function mergeLesson(res){
  // тот же урок, загруженный заново (например, после пересборки),
  // не должен появляться в списке второй раз
  const same = LESSONS.find(l => l.title === res.title);
  const id = same ? same.id : "L" + Date.now().toString(36);
  if(same) same.n = res.words.length;
  else LESSONS.push({id, title:res.title, n:res.words.length});
  let added = 0, merged = 0;
  for(const w of res.words){
    const old = POOL.find(p => keyOf(p) === keyOf(w));
    if(old){
      // прогресс и пометки сохраняем, обновляем только объяснения
      old.m = w.m || old.m; old.ctx = w.ctx || old.ctx; old.em = w.em || old.em;
      if(!old.src.includes(id)) old.src.push(id);
      merged++;
    }else{
      POOL.push({...w, src:[id], st:{ok:0, err:0}, hard:null});
      added++;
    }
  }
  MODE = {kind:"lesson", id};      // после загрузки сразу тренируем новый урок
  savePool();
  return {added, merged, id};
}

// слова, по которым сейчас идёт игра
function activeWords(){
  if(MODE.kind === "hard")   return POOL.filter(isHard);
  if(MODE.kind === "lesson") return POOL.filter(w => w.src.includes(MODE.id));
  return POOL;
}

function modeName(){
  if(MODE.kind === "hard") return "Только трудные";
  if(MODE.kind === "lesson"){
    const l = LESSONS.find(x => x.id === MODE.id);
    return l ? l.title : "Урок";
  }
  return "Все слова";
}

// строка «что тренируем» — обновляется при любой смене набора
function renderSetLine(){
  const el = $("#setline");
  if(el) el.innerHTML = "Тренируем: <b>" + esc(modeName()) + "</b> · слов: " + activeWords().length;
}

function resetGame(){
  renderSetLine();
  used = new Set(); stars = 0; roundNo = 0; hp = 100;
  $("#stars").textContent = "⭐ 0"; $("#hp").style.width = "100%"; $("#round").textContent = "";
}

function buildRound(){
  const set = activeWords();
  // не повторяем самозванца, пока не кончатся слова набора
  let fresh = shuffle(set.filter(w => !used.has(keyOf(w))));
  if(!fresh.length){ used = new Set(); fresh = shuffle(set); }
  const imposter = fresh[0];
  used.add(keyOf(imposter));
  // соседи — из этого же набора: тренируем урок, а не всё подряд.
  // Если в наборе меньше пяти слов, добираем из общей базы.
  let others = shuffle(set.filter(w => w !== imposter)).slice(0, 4);
  if(others.length < 4){
    const extra = shuffle(POOL.filter(w => w !== imposter && !others.includes(w)));
    others = others.concat(extra.slice(0, 4 - others.length));
  }
  const cards = shuffle([{w:imposter, guilty:true}, ...others.map(w=>({w, guilty:false}))]);

  // улики: верная + две чужие
  const wrongTypes = shuffle(Object.keys(PROOF).filter(t => t !== imposter.type)).slice(0,2);
  const proofs = shuffle([
    {...PROOF[imposter.type], right:true},
    ...wrongTypes.map(t => ({...PROOF[t], right:false}))
  ]);

  return {imposter, cards, proofs, mistakes:0, hints:0};
}

}

      ev.stopPropagation(); speak(c.w.ctx);
    });
    el.addEventListener("click", () => {
      if(c.guilty){
        el.classList.add("right");
        talk("Попалась! Теперь <b>докажи</b>, почему это слово неверное.",
             "Попалась! Теперь докажи, почему это слово неверное.", "sad");
        setTimeout(screenProve, 850);
      }else{
        r.mistakes++;
        el.classList.add("wrong");
        setTimeout(()=>{ el.classList.remove("wrong"); el.classList.add("cleared"); }, 420);
        talk("Хи-хи! «" + c.w.t + "» написано <b>верно</b>. Ищи дальше!",
             "Хи-хи! Слово " + c.w.t + " написано верно. Ищи дальше!", "smug");
      }
    });
    box.appendChild(el);
  });

  $("#hint").addEventListener("click", () => {
    r.hints++;
    talk("Подсказка: смотри на <b>конец</b> слова. Клякса прячется в суффиксе.",
         "Подсказка: смотри на конец слова. Клякса прячется в суффиксе.");
    $("#hint").classList.add("hide");
  });

  talk("Одно слово я испортила. Какое — не скажу!",
       "Одно слово я испортила. Какое — не скажу!", "smug");
}

// ============ ЭКРАН 2: улика ======================================
function screenProve(){
  const r = cur, w = r.imposter;
  // Слово остаётся перед глазами: без него ребёнок забывает, что проверяет
  // (замечание после первой игры).
  screen.innerHTML =
    '<h1>Докажи</h1>' +
    '<div class="card suspect"><span class="em">' + w.em + '</span>' +
      '<span class="tx">' + corrupt(w) + '</span>' +
      '<span class="spk" id="sayWord">🔊</span></div>' +
    '<p class="task">Как проверить это слово?</p>' +
    '<div id="proofs"></div>' +
    '<button class="btn ghost" id="hint2">Не знаю, подскажи</button>';

  $("#sayWord").addEventListener("click", () => speak(w.ctx));

  const box = $("#proofs");
  r.proofs.forEach(p => {
    const el = document.createElement("button");
    el.className = "btn proof";
    // Улику можно послушать, не читая: §11 ТЗ — текст на экране только
    // у слов урока, всё остальное доступно на слух.
    el.innerHTML = '<span class="spk">🔊</span>' +
      '<span class="ptx"><span class="pt"></span><span class="pex"></span></span>';
    el.querySelector(".pt").innerHTML = mark(p.text);
    el.querySelector(".pex").innerHTML = "Например: " + mark(p.ex);
    el.querySelector(".spk").addEventListener("click", ev => {
      ev.stopPropagation(); speak(plain(p.text) + " Например: " + plain(p.ex) + ".");
    });
    el.addEventListener("click", () => {
      if(p.right){
        el.classList.add("right");
        talk("Точно! Ты нашла <b>правило</b>. Теперь почини слово.",
             "Точно! Ты нашла правило. Теперь почини слово.", "sad");
        setTimeout(screenFix, 800);
      }else{
        r.mistakes++;
        el.classList.add("wrong");
        setTimeout(()=>el.classList.add("cleared"), 400);
        talk("Не-а, это правило про другое.", "Не-а, это правило про другое.", "smug");
      }
    });
    box.appendChild(el);
  });

  $("#hint2").addEventListener("click", () => {
    r.hints++;
    const h = HINT[w.type](w);
    talk(h, h);
    $("#hint2").classList.add("hide");
  });

  talk("И чем ты это докажешь?", "И чем ты это докажешь?", "smug");
}

// ============ ЭКРАН 3: почини =====================================
function screenFix(){
  const r = cur, w = r.imposter;
  const ch = Array.from(w.t);
  const shown = ch.map((c,k) => k === w.i
      ? '<span class="lit" id="slot">' + w.bad + '</span>' : c).join("");

  screen.innerHTML =
    '<h1>Почини слово</h1>' +
    '<p class="task">Какая буква должна быть на самом деле?</p>' +
    '<div class="word-fix" id="wf">' + shown + '</div>' +
    ruleBlock(w, false, "sayRule") +
    '<div class="letters" id="letters"></div>';

  const sr = $("#sayRule");
  if(sr) sr.addEventListener("click", () => speak(plain(ruleText(w, false))));

  const box = $("#letters");
  shuffle([w.ok, w.bad]).forEach(ltr => {
    const el = document.createElement("button");
    el.className = "letter"; el.textContent = ltr;
    el.addEventListener("click", () => {
      if(ltr === w.ok){
        el.classList.add("right");
        $("#slot").textContent = w.ok;
        $("#slot").className = "fixed";
        finishRound();
      }else{
        r.mistakes++;
        el.classList.add("wrong");
        setTimeout(()=>el.classList.remove("wrong"), 420);
        talk("Мимо! Вспомни правило.", "Мимо! Вспомни правило.", "smug");
      }
    });
    box.appendChild(el);
  });

  autoSpeak("Какая буква должна быть на самом деле?");
}

// ============ итог раунда =========================================
function finishRound(){
  const r = cur, got = award(r);
  stars += got;
  hp = Math.max(0, hp - DMG);
  $("#stars").textContent = "⭐ " + stars;
  $("#hp").style.width = hp + "%";

  const line = r.hints ? "С подсказкой — тоже победа."
             : r.mistakes ? "Со второй попытки — считается!"
             : "И сразу, без единой ошибки!";
  talk("Ай! " + line, "Ай! " + line, "sad");

  // копим статистику по слову: из неё считаются «трудные»
  const w = r.imposter;
  w.st = w.st || {ok:0, err:0};
  if(r.mistakes > 0) w.st.err++; else w.st.ok++;
  savePool();

  // верное слово должно повисеть перед глазами: ради зрительного образа
  // всё и затевалось. Произносим его и держим, пока она не нажмёт «Дальше».
  const correct = Array.from(w.t)
    .map((c,k) => k === w.i ? '<span class="fixed">' + c + '</span>' : c).join("");
  setTimeout(() => autoSpeak(w.t), 700);

  setTimeout(() => {
    screen.innerHTML =
      '<div class="gain">+' + got + ' ⭐</div>' +
      '<p class="task center">Запомни, как пишется:</p>' +
      '<div class="word-fix">' + correct + '</div>' +
      ruleBlock(w, true, "sayRule2", true) +
      '<p class="task center">' + (hp > 0
        ? "У Кляксы осталось " + hp + "% сил."
        : "Клякса разоблачена!") + '</p>' +
      '<button class="btn big" id="next">' +
        (hp > 0 && roundNo < ROUNDS ? "Дальше" : "Итоги") + '</button>';
    const sr = $("#sayRule2");
    if(sr) sr.addEventListener("click", () => speak(plain(ruleText(w, true))));
    $("#next").addEventListener("click", nextRound);
  }, 900);
}

function nextRound(){
  if(roundNo >= ROUNDS || hp <= 0) return screenEnd();
  roundNo++;
  $("#round").textContent = roundNo + " / " + ROUNDS;
  cur = buildRound();
  screenFind();
}

// ============ праздник =============================================
// Салют, шарики и короткая мелодия — всё рисуется и играется на месте,
// без файлов, чтобы игра работала офлайн.
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function jingle(){
  if(quiet || reduced) return;               // 🤐 выключает и музыку
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5]; // до-ми-соль-до-ми
    notes.forEach((f, i) => {
      const t = ac.currentTime + i * 0.12;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.45);
    });
    // финальный аккорд
    [523.25, 659.25, 783.99].forEach(f => {
      const t = ac.currentTime + 0.66;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.2);
    });
    setTimeout(() => ac.close().catch(()=>{}), 2500);
  }catch(e){/* без звука праздник тоже работает */}
}

function fireworks(){
  if(reduced) return;
  const cv = document.createElement("canvas"); cv.id = "fx";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";

  const COLORS = ["#fbbf24","#f472b6","#22d3ee","#a78bfa","#4ade80","#fb923c"];
  let parts = [];
  function burst(x, y){
    const c = COLORS[(Math.random()*COLORS.length)|0];
    for(let i = 0; i < 46; i++){
      const a = (Math.PI * 2 * i) / 46 + Math.random() * .2;
      const sp = (1.6 + Math.random() * 2.6) * dpr;
      parts.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1,
                  c: Math.random() < .25 ? "#fff" : c});
    }
  }
  const shots = [[.3,.3],[.7,.28],[.5,.45],[.22,.5],[.8,.5]];
  shots.forEach((s, i) => setTimeout(() => burst(W*s[0], H*s[1]), i * 420));

  let stop = false;
  (function frame(){
    ctx.clearRect(0,0,W,H);
    parts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .06 * dpr; p.vx *= .99; p.vy *= .99;
      p.life -= .012;
      if(p.life > 0){
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.6*dpr, 0, 7); ctx.fill();
      }
    });
    parts = parts.filter(p => p.life > 0);
    if(!stop) requestAnimationFrame(frame);
  })();
  setTimeout(() => { stop = true; cv.remove(); }, 4200);
}

function balloons(){
  if(reduced) return;
  const C = ["#f472b6","#fbbf24","#22d3ee","#a78bfa","#4ade80"];
  for(let i = 0; i < 5; i++){
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.setProperty("--dx", (i - 2) * 46 + "px");
    b.style.animationDelay = (i * 0.28) + "s";
    b.style.animationDuration = (4.4 + i * 0.35) + "s";
    b.innerHTML =
      '<svg viewBox="0 0 60 92"><ellipse cx="30" cy="32" rx="26" ry="31" fill="' + C[i] + '"/>' +
      '<ellipse cx="21" cy="21" rx="7" ry="10" fill="#fff" opacity=".45"/>' +
      '<path d="M30 63l-6 7h12z" fill="' + C[i] + '"/>' +
      '<path d="M30 70c7 7-7 13 0 21" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/></svg>';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 7000);
  }
}

// ============ финал ================================================
// Имя ребёнка в коде не хранится: репозиторий публичный. Оно задаётся
// на самом телефоне и остаётся там же (в приложении придёт из профиля).
function childName(){
  try{ return (localStorage.getItem("slovograd.name") || "").trim(); }catch(e){ return ""; }
}

function screenEnd(){
  $("#round").textContent = "";
  screen.innerHTML =
    '<h1 class="center">Ты победила Кляксу!</h1>' +
    '<div class="scroll">' +
      '<div class="rod"></div>' +
      '<div class="parch"><div class="in">' +
        (childName() ? '<div class="who">' + esc(childName()) + ',</div>' : '') +
        '<div class="hooray">ты молодчина!</div>' +
        '<div class="seal">⭐</div>' +
      '</div></div>' +
      '<div class="rod"></div>' +
    '</div>' +
    '<div class="gain big">⭐ ' + stars + '</div>' +
    '<p class="task center">Ты поймала всех самозванцев и про каждого назвала правило.</p>' +
    '<button class="btn big" id="again">Ещё раз</button>';

  $("#again").addEventListener("click", () => {
    stars = 0; roundNo = 0; hp = 100;
    $("#stars").textContent = "⭐ 0"; $("#hp").style.width = "100%";
    nextRound();
  });

  fireworks(); balloons(); jingle();
  talk("Ну ладно, ладно… ты победила. <b>Пока что!</b>",
       "Ну ладно, ладно, ты победила. Пока что!", "sad");
}

// ============ шрифт: тетрадь / печатный ===========================
// Рукописный ближе к тому, как она пишет в тетради, печатный может
// читаться легче. Какой лучше — выясняем на ней, поэтому переключатель.
function setPrint(on){
  document.body.classList.toggle("print", on);
  $("#fontToggle").textContent = on ? "✍️" : "Аа";
  try{ localStorage.setItem("slovograd.print", on ? "1" : "0"); }catch(e){}
}
let savedPrint = false;
try{ savedPrint = localStorage.getItem("slovograd.print") === "1"; }catch(e){}
setPrint(savedPrint);
$("#fontToggle").addEventListener("click", () => setPrint(!document.body.classList.contains("print")));

// --- панель урока ---------------------------------------------------
// Метка версии: по ней видно, обновилась ли страница на телефоне
// или браузер показывает старую из кэша.
const VERSION = "25 сентября, 17:40";
$("#ver").textContent = VERSION;

const panel = $("#lessonPanel"), lmsg = $("#lessonMsg");

function showLessonMsg(text, cls){ lmsg.textContent = text; lmsg.className = "task " + (cls || ""); }

// база слов из памяти; при первом запуске кладём встроенный урок
loadPool();
if(!POOL.length){
  mergeLesson({title:LESSON.title, words:LESSON.words, skipped:[]});
  MODE = {kind:"all"}; savePool();
}

function setMode(m){ MODE = m; used = new Set(); savePool(); renderPanel(); resetGame(); startScreen(); }

// В игре — только выбор набора. Всё остальное (уроки, база слов,
// имя игрока) живёт в кабинете: ../parent/
function renderPanel(){
  const modes = [{kind:"all"}, {kind:"hard"}].concat(LESSONS.map(l => ({kind:"lesson", id:l.id})));
  $("#modes").innerHTML = modes.map((m, k) => {
    const n = m.kind === "hard" ? POOL.filter(isHard).length
            : m.kind === "all"  ? POOL.length
            : POOL.filter(w => w.src.includes(m.id)).length;
    const name = m.kind === "hard" ? "Только трудные"
               : m.kind === "all"  ? "Все слова"
               : (LESSONS.find(x => x.id === m.id) || {}).title;
    const on = JSON.stringify(m) === JSON.stringify(MODE);
    return '<button class="mode' + (on ? " on" : "") + '" data-k="' + k + '">' +
           esc(name) + ' <b>' + n + '</b></button>';
  }).join("");
  [...document.querySelectorAll("#modes .mode")].forEach(b =>
    b.addEventListener("click", () => setMode(modes[+b.dataset.k])));

}

$("#lessonBtn").addEventListener("click", () => {
  panel.hidden = !panel.hidden;
  if(!panel.hidden){
    renderPanel();
    showLessonMsg("Сейчас тренируем: «" + modeName() + "», слов: " + activeWords().length);
  }
});

setQuiet(quiet);
$("#voiceToggle").addEventListener("click", () => setQuiet(!quiet));
// пузырь: повторить реплику Кляксы — работает и когда она «молчит»
say.addEventListener("click", () => { if(lastLine) speak(lastLine); });

// ============ старт ===============================================
function startScreen(){
  renderSetLine();
  screen.innerHTML =
    '<h1>Словоград</h1>' +
    '<p class="task">Клякса пробралась в слова урока и портит буквы. ' +
    'Найди самозванца, докажи его вину и почини слово.</p>' +
    '<p class="task">Тренируем: «' + esc(modeName()) + '», слов: ' + activeWords().length + '</p>' +
    '<p class="task" style="opacity:.75">Версия игры: ' + VERSION + '</p>' +
    '<button class="btn big" id="start">Играть</button>';
  $("#start").addEventListener("click", () => {
    panel.hidden = true;          // панель родителя ребёнку в игре не нужна
    autoSpeak("Начинаем!");
    nextRound();
  });
}
startScreen();
talk("Привет" + (childName() ? ", " + esc(childName()) : "") + "! Я Клякса. Спорим, ты меня не найдёшь?", null, "smug");
</script>
